[package]
name = "eldencraft"
version = "0.2.5"
edition = "2024"
license = "MIT"
description = "EldenCraft: play Elden Ring as a Minecraft player (Elden Ring side, loaded by ModEngine2)"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# fromsoftware-rs pinned to the commit the design was read from (Ww2710 = eldenring.exe 2.7.1.0).
eldenring = { git = "https://github.com/vswarte/fromsoftware-rs", rev = "59fbd3b3b7daaf14aca47c9f73530493dba6bc79" }
fromsoftware-shared = { git = "https://github.com/vswarte/fromsoftware-rs", rev = "59fbd3b3b7daaf14aca47c9f73530493dba6bc79" }

# Minecraft's HUD drawn over the finished frame (Dear ImGui on Elden Ring's DirectX 12 present).
hudhook = { git = "https://github.com/veeenu/hudhook", tag = "0.9.3", default-features = false, features = ["dx12"] }

[dependencies.windows-sys]
version = "0.59"
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Memory",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
    "Win32_System_SystemInformation",
    "Win32_System_Performance",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
]

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
debug = "line-tables-only"
