# ModEngine2 profile for EldenCraft. Melty starts Elden Ring through ModEngine2 with this file:
# offline, Easy Anti-Cheat off. Paths are relative to this file.
[modengine]
debug = false
external_dlls = ["eldencraft.dll"]

[extension.mod_loader]
enabled = true
loose_params = false
mods = []

[extension.scylla_hide]
enabled = false
